<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Information Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 32px;
        }

        header {
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #343a40;
            margin-bottom: 6px;
        }

        .help-text {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            color: #212529;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 6px;
            outline: none;
        }

        input[type="number"]:focus, select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: #0d6efd;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            margin-top: 24px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #0b5ed7;
        }

        .btn-submit:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .btn-fill {
            background: none;
            border: none;
            color: #0d6efd;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-bottom: 16px;
            display: inline-block;
        }

        .error-box {
            display: none;
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 16px;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-link a {
            color: #6c757d;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Customer Details</h1>
            <p class="subtitle">Fill in the fields below to calculate churn probability.</p>
        </header>

        <button type="button" class="btn-fill" onclick="fillSample()">Fill with sample data</button>

        <form id="churnForm" onsubmit="submitForm(event)">
            
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senior_citizen">Senior Citizen</label>
                <select id="senior_citizen" name="senior_citizen" required>
                    <option value="0">No (Age under 65)</option>
                    <option value="1">Yes (Age 65 or older)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tenure">Tenure (in months)</label>
                <input type="number" id="tenure" name="tenure" min="1" max="72" value="12" required>
                <div class="help-text">Number of months the customer has stayed with the company (1 - 72).</div>
            </div>

            <div class="form-group">
                <label for="monthly_charges">Monthly Charges ($)</label>
                <input type="number" id="monthly_charges" name="monthly_charges" step="0.5" min="20" max="120" value="70.0" required>
                <div class="help-text">Current monthly bill amount in USD (20.00 - 120.00).</div>
            </div>

            <div class="form-group">
                <label for="contract">Contract Type</label>
                <select id="contract" name="contract" required>
                    <option value="0">Month-to-month</option>
                    <option value="1">One year</option>
                    <option value="2">Two year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="internet_service">Internet Service</label>
                <select id="internet_service" name="internet_service" required>
                    <option value="0">DSL</option>
                    <option value="1">Fiber optic</option>
                </select>
            </div>

            <div id="errorBox" class="error-box"></div>

            <button type="submit" id="submitBtn" class="btn-submit">Predict Customer Churn</button>
        </form>

        <div class="footer-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        function fillSample() {
            document.getElementById('gender').value = '1';
            document.getElementById('senior_citizen').value = '0';
            document.getElementById('tenure').value = '8';
            document.getElementById('monthly_charges').value = '75.0';
            document.getElementById('contract').value = '0';
            document.getElementById('internet_service').value = '1';
        }

        async function submitForm(e) {
            e.preventDefault();

            const form = document.getElementById('churnForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Calculating...';

            const payload = {
                gender: parseInt(form.gender.value),
                senior_citizen: parseInt(form.senior_citizen.value),
                tenure: parseInt(form.tenure.value),
                monthly_charges: parseFloat(form.monthly_charges.value),
                contract: parseInt(form.contract.value),
                internet_service: parseInt(form.internet_service.value)
            };

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    throw new Error('Server returned an error.');
                }

                const result = await res.json();
                sessionStorage.setItem('churnResult', JSON.stringify(result));
                sessionStorage.setItem('customerInput', JSON.stringify(payload));

                window.location.href = '/result.html';
            } catch (err) {
                errorBox.innerText = 'Unable to get prediction. Please ensure the server is running.';
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Predict Customer Churn';
            }
        }
    </script>
</body>
</html>
