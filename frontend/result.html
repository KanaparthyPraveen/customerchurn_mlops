<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 32px;
        }

        header {
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }

        p.subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .result-box {
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 24px;
            border: 1px solid transparent;
        }

        .result-box.churn {
            background-color: #fff5f5;
            border-color: #feb2b2;
            color: #9b1c1c;
        }

        .result-box.no-churn {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .result-prob {
            font-size: 15px;
            font-weight: 500;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 12px;
        }

        .details-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .details-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e9ecef;
        }

        .details-table td:first-child {
            color: #6c757d;
            width: 50%;
        }

        .details-table td:last-child {
            font-weight: 500;
            color: #212529;
        }

        .btn-action {
            display: block;
            width: 100%;
            background-color: #0d6efd;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-action:hover {
            background-color: #0b5ed7;
        }

        .btn-secondary {
            display: block;
            width: 100%;
            background-color: #f8f9fa;
            color: #212529;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            border: 1px solid #ced4da;
        }

        .btn-secondary:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Prediction Result</h1>
            <p class="subtitle">Outcome based on trained Machine Learning Model</p>
        </header>

        <div id="resultBox" class="result-box no-churn">
            <div id="resultTitle" class="result-title">Analyzing...</div>
            <div id="resultProb" class="result-prob"></div>
        </div>

        <h2>Submitted Customer Information</h2>
        <table class="details-table">
            <tr>
                <td>Gender</td>
                <td id="valGender">--</td>
            </tr>
            <tr>
                <td>Senior Citizen</td>
                <td id="valSenior">--</td>
            </tr>
            <tr>
                <td>Tenure</td>
                <td id="valTenure">--</td>
            </tr>
            <tr>
                <td>Monthly Charges</td>
                <td id="valCharges">--</td>
            </tr>
            <tr>
                <td>Contract</td>
                <td id="valContract">--</td>
            </tr>
            <tr>
                <td>Internet Service</td>
                <td id="valInternet">--</td>
            </tr>
        </table>

        <a href="/prediction" class="btn-action">Predict Another Customer</a>
        <a href="/" class="btn-secondary">Back to Home</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rawResult = sessionStorage.getItem("churnResult");
            const rawInput = sessionStorage.getItem("customerInput");

            if (!rawResult) {
                document.getElementById('resultTitle').innerText = "No prediction data found.";
                document.getElementById('resultProb').innerText = "Please return to the form and submit customer details.";
                return;
            }

            try {
                const result = JSON.parse(rawResult);
                const input = rawInput ? JSON.parse(rawInput) : null;

                const resultBox = document.getElementById('resultBox');
                const resultTitle = document.getElementById('resultTitle');
                const resultProb = document.getElementById('resultProb');

                const isChurn = result.prediction === 1 || (result.result && result.result.toLowerCase().includes("likely to churn") && !result.result.toLowerCase().includes("unlikely"));
                const prob = result.probability !== undefined ? (result.probability * 100).toFixed(1) : null;

                if (isChurn) {
                    resultBox.className = "result-box churn";
                    resultTitle.innerText = "Customer is likely to churn";
                } else {
                    resultBox.className = "result-box no-churn";
                    resultTitle.innerText = "Customer is unlikely to churn";
                }

                if (prob !== null) {
                    resultProb.innerText = `Churn Probability: ${prob}%`;
                }

                if (input) {
                    const contracts = ["Month-to-month", "One year", "Two year"];
                    const internet = ["DSL", "Fiber optic"];

                    document.getElementById('valGender').innerText = input.gender === 1 ? "Male" : "Female";
                    document.getElementById('valSenior').innerText = input.senior_citizen === 1 ? "Yes" : "No";
                    document.getElementById('valTenure').innerText = `${input.tenure} months`;
                    document.getElementById('valCharges').innerText = `$${parseFloat(input.monthly_charges).toFixed(2)}`;
                    document.getElementById('valContract').innerText = contracts[input.contract] || "Month-to-month";
                    document.getElementById('valInternet').innerText = internet[input.internet_service] || "DSL";
                }
            } catch (e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
